# The Windows program (desktop/): built on a Windows machine, then tested there as the user gets it
# (desktop/test/program.test.mjs against out/win-unpacked/SigortaPortfoy.exe). The installer and the portable .exe
# are kept as downloads of the run (Actions → the run → Artifacts). A version tag (v1.0.1 …) also puts them on a
# GitHub release.
name: Windows programı

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'assets/**'
      - 'package.json'
      - 'tools/build-single.mjs'
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # only the release step at the end uses it, on a version tag
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the build tools
        working-directory: desktop
        run: npm ci

      - name: Build the installer and the portable program
        working-directory: desktop
        run: npm run dist

      - name: Install it as a user would (silently)
        shell: pwsh
        run: |
          $setup = Get-Item desktop/out/Sigorta-Portfoy-Kurulum-*.exe
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer stopped with code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\sigorta-portfoy\SigortaPortfoy.exe'
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          foreach ($folder in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            if (-not (Get-ChildItem -Path $folder -Filter 'Sigorta Portf*.lnk' -ErrorAction SilentlyContinue)) { throw "no shortcut in $folder" }
          }
          "SIGORTA_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "installed: $exe"

      - name: Test the installed program
        working-directory: desktop
        run: npm test

      - name: Start the portable program once
        shell: pwsh
        run: |
          $portable = Get-Item desktop/out/Sigorta-Portfoy-Tasinabilir-*.exe
          $data = Join-Path $env:RUNNER_TEMP 'portable-data'
          Start-Process -FilePath $portable.FullName -ArgumentList "--data-dir=$data"
          # the app's page opens its database once it runs
          for ($i = 0; $i -lt 90 -and -not (Test-Path (Join-Path $data 'IndexedDB'))); $i++) { Start-Sleep -Seconds 1 }
          $ok = Test-Path (Join-Path $data 'IndexedDB')
          Get-Process -Name 'SigortaPortfoy', 'Sigorta-Portfoy-Tasinabilir-*' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw 'the portable program did not open the app' }
          Write-Output 'the portable program opened the app'

      - name: Uninstall it again
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\sigorta-portfoy'
          Start-Process -FilePath (Join-Path $dir 'Uninstall SigortaPortfoy.exe') -ArgumentList '/S' -Wait
          # the uninstaller goes on from a copy of itself; wait until the program is gone
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'SigortaPortfoy.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'SigortaPortfoy.exe')) { throw 'the program is still there after uninstalling' }
          Write-Output 'uninstalled'

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          path: desktop/out/Sigorta-Portfoy-Kurulum-*.exe
          archive: false
          if-no-files-found: error

      - name: Keep the portable program
        uses: actions/upload-artifact@v7
        with:
          path: desktop/out/Sigorta-Portfoy-Tasinabilir-*.exe
          archive: false
          if-no-files-found: error

      - name: Put both on a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/out/Sigorta-Portfoy-Kurulum-*.exe desktop/out/Sigorta-Portfoy-Tasinabilir-*.exe \
            --repo "$GITHUB_REPOSITORY" --title "Sigorta Portföy $GITHUB_REF_NAME" \
            --notes "Windows programı: Sigorta-Portfoy-Kurulum (kurulum, önerilen) veya Sigorta-Portfoy-Tasinabilir (kurulumsuz, tek dosya). Windows 10 / 11, 64 bit."
